<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football-Data API Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f3ef;
      color: #111;
      padding: 40px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #333;
    }

    #status {
      margin: 25px 0;
      font-size: 14px;
    }

    .match {
      background: white;
      border: 1px solid #ddd;
      padding: 18px;
      margin-bottom: 10px;
      max-width: 600px;
    }

    .date {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .teams {
      font-size: 18px;
      font-weight: bold;
    }

    .competition {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <h1>Football-Data API</h1>
  <p>Test calendario Juventus</p>

  <button onclick="loadMatches()">CARICA PARTITE</button>

  <div id="status"></div>
  <div id="matches"></div>

  <script>

    // INCOLLA QUI LA TUA API KEY
    const API_KEY = "INCOLLA_LA_TUA_KEY_QUI";

    async function loadMatches() {

      const status = document.getElementById("status");
      const matchesContainer = document.getElementById("matches");

      status.textContent = "Caricamento...";
      matchesContainer.innerHTML = "";

      try {

        const response = await fetch(
          "https://api.football-data.org/v4/teams/109/matches?status=SCHEDULED",
          {
            headers: {
              "X-Auth-Token": API_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("Errore API: " + response.status);
        }

        const data = await response.json();

        status.textContent =
          "Partite ricevute: " + data.matches.length;

        data.matches.forEach(match => {

          const date = new Date(match.utcDate);

          const formattedDate = date.toLocaleDateString("it-IT", {
            day: "2-digit",
            month: "short",
            year: "numeric"
          });

          const formattedTime = date.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit"
          });

          const matchElement = document.createElement("div");

          matchElement.className = "match";

          matchElement.innerHTML = `
            <div class="date">
              ${formattedDate} · ${formattedTime}
            </div>

            <div class="teams">
              ${match.homeTeam.name}
              —
              ${match.awayTeam.name}
            </div>

            <div class="competition">
              ${match.competition.name}
            </div>
          `;

          matchesContainer.appendChild(matchElement);

        });

      } catch (error) {

        status.textContent =
          "Errore: " + error.message;

        console.error(error);

      }

    }

  </script>

</body>
</html>
