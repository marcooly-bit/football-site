<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Giocatori | Pages Of Football</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="giocatori.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="brand">
      <a href="index.html">Pages Of Football</a>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="giocatori.html" class="active">Giocatori</a>
      <a href="squadre.html">Squadre</a>
      <a href="competizioni.html">Competizioni</a>
      <a href="almanacco.html">Almanacco</a>
    </nav>

  </header>


  <!-- HERO -->
  <section class="players-hero">

    <div class="players-hero-content">

      <span class="eyebrow">PAGES OF FOOTBALL</span>

      <h1>Giocatori</h1>

      <p>
        Profili, numeri e storie dei protagonisti del calcio.
      </p>

    </div>

  </section>


  <!-- TOOLBAR -->
  <section class="players-toolbar">

    <div>
      <span class="toolbar-label">DATABASE</span>
      <h2>Calciatori</h2>
    </div>

    <div class="toolbar-season">
      <span class="toolbar-label">STAGIONE</span>
      <strong>2026 / 27</strong>
    </div>

  </section>


  <!-- PLAYERS -->
  <main class="players-page">

    <div id="players-container"></div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-brand">
      Pages Of Football
    </div>

    <div class="footer-text">
      Football • Database • History
    </div>

  </footer>


  <!-- DATABASE GIOCATORI -->
  <script src="data/players.js"></script>


  <!-- GENERAZIONE AUTOMATICA DELLA LISTA -->
  <script>

    const playersContainer = document.getElementById("players-container");

    const positionOrder = [
      "Portiere",
      "Difensore",
      "Centrocampista",
      "Attaccante"
    ];

    const positionLabels = {
      "Portiere": {
        number: "01",
        italian: "PORTIERI",
        english: "Goalkeepers"
      },

      "Difensore": {
        number: "02",
        italian: "DIFENSORI",
        english: "Defenders"
      },

      "Centrocampista": {
        number: "03",
        italian: "CENTROCAMPISTI",
        english: "Midfielders"
      },

      "Attaccante": {
        number: "04",
        italian: "ATTACCANTI",
        english: "Forwards"
      }
    };


    positionOrder.forEach(position => {

      const positionPlayers = players
        .filter(player => player.position === position)
        .sort((a, b) => a.name.localeCompare(b.name, "it"));


      if (positionPlayers.length === 0) {
        return;
      }


      const section = document.createElement("section");

      section.className = "team-section";


      section.innerHTML = `
        <div class="section-heading">

          <span class="section-number">
            ${positionLabels[position].number}
          </span>

          <div>

            <span class="section-kicker">
              ${positionLabels[position].italian}
            </span>

            <h2>
              ${positionLabels[position].english}
            </h2>

          </div>

        </div>

        <div class="players-list"></div>
      `;


      const playersList = section.querySelector(".players-list");


      positionPlayers.forEach(player => {

        const playerRow = document.createElement("a");

        playerRow.className = "player-row";

        playerRow.href = "#";

        playerRow.innerHTML = `

          <div class="player-row-number">
            ${player.number}
          </div>

          <div class="player-row-photo">

            <img
              src="${player.image}"
              alt="${player.name}"
            >

          </div>

          <div class="player-row-name">

            <strong>
              ${player.name}
            </strong>

          </div>

          <div class="player-row-team">

            <span>
              ${player.team}
            </span>

          </div>

          <div class="player-row-arrow">
            →
          </div>

        `;


        playersList.appendChild(playerRow);

      });


      playersContainer.appendChild(section);

    });

  </script>

</body>
</html>
```
